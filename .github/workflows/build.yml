name: Build Cortex

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type-check Svelte
        run: bun run check
      - name: Build web assets
        run: bun run build

  desktop:
    name: Desktop build (${{ matrix.os }})
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build unsigned Tauri application
        run: bun run tauri build --config src-tauri/tauri.ci.conf.json ${{ runner.os == 'Linux' && '--bundles deb,appimage' || '' }}
      - name: Upload desktop bundles
        uses: actions/upload-artifact@v4
        with:
          name: cortex-${{ runner.os }}
          path: src-tauri/target/release/bundle/
          if-no-files-found: error
